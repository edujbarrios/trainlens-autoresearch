<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">TrainLens AutoResearch evidence-driven research loop</title>
  <desc id="desc">Scientific-paper style workflow diagram: inspect project or notebook, collect TrainLens evidence, state uncertainty, form a hypothesis, run the cheapest informative experiment, collect TrainLens evidence again, then keep, revert, or investigate and repeat.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1800" height="820" fill="#ffffff"/>

  <!-- Figure header -->
  <text x="70" y="72" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a">
    TrainLens AutoResearch: evidence-driven research loop
  </text>
  <text x="70" y="110" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">
    Minimal research policy for coding agents: observe, resolve uncertainty with one informative experiment, and iterate from evidence.
  </text>
  <line x1="70" y1="138" x2="1730" y2="138" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Flow arrows: top row -->
  <line x1="335" y1="275" x2="395" y2="275" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="655" y1="275" x2="715" y2="275" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="975" y1="275" x2="1035" y2="275" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1295" y1="275" x2="1355" y2="275" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Down and return arrows -->
  <line x1="1540" y1="335" x2="1540" y2="465" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowAccent)"/>
  <line x1="1355" y1="545" x2="1215" y2="545" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Feedback loop -->
  <path d="M 900 605
           C 900 700, 700 720, 420 720
           C 180 720, 150 640, 150 365"
        fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="430" y="692" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="italic" fill="#64748b">
    repeat with updated evidence
  </text>

  <!-- Stage 1 -->
  <g filter="url(#softShadow)">
    <rect x="70" y="215" rx="10" ry="10" width="265" height="120" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  </g>
  <circle cx="102" cy="247" r="17" fill="#0f172a"/>
  <text x="102" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">1</text>
  <text x="202" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Inspect project</text>
  <text x="202" y="293" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">or notebook</text>

  <!-- Stage 2: evidence -->
  <g filter="url(#softShadow)">
    <rect x="395" y="215" rx="10" ry="10" width="260" height="120" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <circle cx="427" cy="247" r="17" fill="#2563eb"/>
  <text x="427" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="525" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">TrainLens</text>
  <text x="525" y="293" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1d4ed8">evidence</text>

  <!-- Stage 3 -->
  <g filter="url(#softShadow)">
    <rect x="715" y="215" rx="10" ry="10" width="260" height="120" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  </g>
  <circle cx="747" cy="247" r="17" fill="#0f172a"/>
  <text x="747" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <text x="845" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">State</text>
  <text x="845" y="293" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">uncertainty</text>

  <!-- Stage 4 -->
  <g filter="url(#softShadow)">
    <rect x="1035" y="215" rx="10" ry="10" width="260" height="120" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  </g>
  <circle cx="1067" cy="247" r="17" fill="#0f172a"/>
  <text x="1067" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">4</text>
  <text x="1165" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Form</text>
  <text x="1165" y="293" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">hypothesis</text>

  <!-- Stage 5 -->
  <g filter="url(#softShadow)">
    <rect x="1355" y="205" rx="10" ry="10" width="370" height="130" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  </g>
  <circle cx="1387" cy="237" r="17" fill="#0f172a"/>
  <text x="1387" y="243" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">5</text>
  <text x="1540" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Run cheapest informative</text>
  <text x="1540" y="283" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">experiment</text>
  <text x="1540" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">one conceptual change when possible</text>

  <!-- Stage 6: evidence -->
  <g filter="url(#softShadow)">
    <rect x="1355" y="485" rx="10" ry="10" width="370" height="120" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <circle cx="1387" cy="517" r="17" fill="#2563eb"/>
  <text x="1387" y="523" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">6</text>
  <text x="1540" y="534" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">TrainLens evidence</text>
  <text x="1540" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1d4ed8">measure outcome against the goal</text>

  <!-- Stage 7 -->
  <g filter="url(#softShadow)">
    <rect x="900" y="485" rx="10" ry="10" width="315" height="120" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  </g>
  <circle cx="932" cy="517" r="17" fill="#0f172a"/>
  <text x="932" y="523" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">7</text>
  <text x="1058" y="534" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Keep · revert</text>
  <text x="1058" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">or investigate</text>

  <!-- Evidence/Reasoning distinction -->
  <rect x="70" y="760" width="1660" height="1.5" fill="#cbd5e1"/>
  <circle cx="88" cy="790" r="8" fill="#2563eb"/>
  <text x="106" y="797" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">
    Blue stages: TrainLens supplies evidence.
  </text>
  <circle cx="420" cy="790" r="8" fill="#0f172a"/>
  <text x="438" y="797" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">
    Neutral stages: the host coding agent supplies reasoning and execution.
  </text>
</svg>